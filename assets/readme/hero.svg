<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">柜台助手演示</title>
  <desc id="desc">填入 OpenAI 兼容 API Key 即可提问。导航其它栏是占位，没有真实收银账本。</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8d6"/>
      <stop offset="1" stop-color="#fff4e5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="26" fill="url(#wash)"/>
  <rect x="1" y="1" width="1198" height="398" rx="25" fill="none" stroke="#e4cdb0"/>
  <g id="title-block" transform="translate(64 72)">
    <text x="0" y="0" fill="#7a654f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">柜台演示 · 无需登录</text>
    <text x="0" y="72" fill="#d62828" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="700">柜台助手演示</text>
    <text x="0" y="124" fill="#2b2118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22">填入 API Key，就能问营业与客流。</text>
    <text x="0" y="158" fill="#7a654f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">其它收银台栏位是占位。确认不会改账。</text>
    <g transform="translate(0 196)">
      <rect width="112" height="36" rx="18" fill="#fffaf3" stroke="#e4cdb0"/>
      <text x="56" y="24" text-anchor="middle" fill="#2b2118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">无需登录</text>
      <rect x="124" width="136" height="36" rx="18" fill="#fffaf3" stroke="#e4cdb0"/>
      <text x="192" y="24" text-anchor="middle" fill="#2b2118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Python 3.11</text>
      <rect x="272" width="116" height="36" rx="18" fill="#fffaf3" stroke="#e4cdb0"/>
      <text x="330" y="24" text-anchor="middle" fill="#2b2118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Node 20</text>
    </g>
  </g>
  <g id="project-proof" transform="translate(668 48)">
    <rect width="476" height="304" rx="20" fill="#fffaf3" stroke="#e4cdb0"/>
    <rect x="16" y="16" width="444" height="44" rx="14" fill="#fff4e5" stroke="#e4cdb0"/>
    <text x="32" y="44" fill="#d62828" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700">柜台助手演示</text>
    <rect x="156" y="24" width="72" height="28" rx="14" fill="#fffaf3" stroke="#e4cdb0"/>
    <text x="192" y="44" text-anchor="middle" fill="#7a654f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">订单</text>
    <rect x="234" y="24" width="72" height="28" rx="14" fill="#d62828"/>
    <text x="270" y="44" text-anchor="middle" fill="#fffaf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">助手</text>
    <rect x="312" y="24" width="72" height="28" rx="14" fill="#fffaf3" stroke="#e4cdb0"/>
    <text x="348" y="44" text-anchor="middle" fill="#7a654f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">设置</text>
    <rect x="32" y="84" width="196" height="40" rx="12" fill="#ffe3e0"/>
    <text x="130" y="110" text-anchor="middle" fill="#2b2118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">今天营业额是多少</text>
    <rect x="236" y="84" width="208" height="40" rx="12" fill="#fff4e5" stroke="#e4cdb0"/>
    <text x="340" y="110" text-anchor="middle" fill="#2b2118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">开台时段主要是什么</text>
    <rect x="32" y="140" width="412" height="132" rx="16" fill="#ffffff" stroke="#e4cdb0"/>
    <text x="52" y="176" fill="#7a654f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16">演示数据</text>
    <text x="52" y="214" fill="#2b2118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" font-weight="700">今日营业额 1280.00 元</text>
    <text x="52" y="248" fill="#7a654f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16">主要以扫码支付 · 座位图未接入</text>
  </g>
</svg>

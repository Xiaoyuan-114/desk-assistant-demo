<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">柜台助手演示</title>
  <desc id="desc">填入 OpenAI 兼容 API Key 即可提问。左侧历史栏加底部输入条，和真实界面一致。</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8d6"/>
      <stop offset="1" stop-color="#fff4e5"/>
    </linearGradient>
    <clipPath id="win">
      <rect x="0" y="0" width="500" height="332" rx="18"/>
    </clipPath>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#wash)"/>
  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="#e4cdb0"/>
  <g id="title-block" transform="translate(56 80)">
    <text x="0" y="0" fill="#7a654f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">柜台演示 · 无需登录</text>
    <text x="0" y="72" fill="#d62828" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="700">柜台助手演示</text>
    <text x="0" y="124" fill="#2b2118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22">填入 API Key，就能问营业与客流。</text>
    <text x="0" y="158" fill="#7a654f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">其它收银台栏位是占位。确认不会改账。</text>
    <g transform="translate(0 204)">
      <rect width="112" height="36" rx="18" fill="#fffaf3" stroke="#e4cdb0"/>
      <text x="56" y="24" text-anchor="middle" fill="#2b2118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">无需登录</text>
      <rect x="124" width="136" height="36" rx="18" fill="#fffaf3" stroke="#e4cdb0"/>
      <text x="192" y="24" text-anchor="middle" fill="#2b2118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Python 3.11</text>
      <rect x="272" width="116" height="36" rx="18" fill="#fffaf3" stroke="#e4cdb0"/>
      <text x="330" y="24" text-anchor="middle" fill="#2b2118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Node 20</text>
    </g>
  </g>
  <g id="project-proof" transform="translate(656 44)">
    <rect width="500" height="332" rx="18" fill="#fffaf3" stroke="#e4cdb0"/>
    <g clip-path="url(#win)">
      <rect width="500" height="48" fill="#fffaf3"/>
      <circle cx="28" cy="24" r="14" fill="#fff" stroke="#e4cdb0"/>
      <text x="28" y="29" text-anchor="middle" fill="#d62828" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" font-weight="700">柜</text>
      <rect x="200" y="12" width="56" height="24" rx="12" fill="#d62828"/>
      <text x="228" y="29" text-anchor="middle" fill="#fffaf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14">助手</text>
      <rect x="262" y="12" width="56" height="24" rx="12" fill="#f3e6d4"/>
      <text x="290" y="29" text-anchor="middle" fill="#7a654f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14">设置</text>
      <rect x="430" y="12" width="52" height="24" rx="12" fill="#f3e6d4"/>
      <text x="456" y="29" text-anchor="middle" fill="#7a654f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14">演示</text>
      <rect y="48" width="118" height="284" fill="#f3e6d4"/>
      <text x="16" y="80" fill="#2b2118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="700">新对话</text>
      <text x="16" y="112" fill="#7a654f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16">最近</text>
      <text x="140" y="84" fill="#2b2118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700">柜台助手</text>
      <rect x="140" y="104" width="200" height="36" rx="18" fill="#f3e6d4"/>
      <text x="156" y="128" fill="#3d2918" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16">今天营业额</text>
      <rect x="140" y="148" width="200" height="36" rx="18" fill="#f3e6d4"/>
      <text x="156" y="172" fill="#3d2918" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16">支付方式</text>
      <rect x="140" y="192" width="200" height="36" rx="18" fill="#f3e6d4"/>
      <text x="156" y="216" fill="#3d2918" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16">开台时段</text>
      <rect x="140" y="268" width="336" height="48" rx="16" fill="#fff" stroke="#e4cdb0"/>
      <text x="156" y="298" fill="#7a654f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16">例如：今天营业额多少</text>
      <rect x="388" y="276" width="76" height="32" rx="12" fill="#d62828"/>
      <text x="426" y="298" text-anchor="middle" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16">发送</text>
    </g>
  </g>
</svg>
